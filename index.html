<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nuestro juego ♡</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          #f3dfc8 0%,
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          #e8d0b5 0%,
          transparent 35%
        ),
        #f8f3ec;

      color: #3b2b22;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 22px;
    }


    /* =====================================================
       CONTENEDOR PRINCIPAL
       ===================================================== */

    .page {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }


    /* =====================================================
       ENCABEZADO
       ===================================================== */

    .small-title {

      font-family: Arial, sans-serif;

      font-size: 11px;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #9a7659;

      margin-bottom: 12px;
    }


    h1 {

      font-size: clamp(36px, 10vw, 54px);

      font-weight: normal;

      line-height: 1.05;

      margin-bottom: 8px;

      color: #39271e;
    }


    .subtitle {

      font-size: 15px;

      color: #866b58;

      font-style: italic;

      margin-bottom: 20px;
    }


    .ornament {

      color: #b18a5c;

      font-size: 20px;

      margin: 10px 0 25px;

      letter-spacing: 8px;
    }


    /* =====================================================
       MENÚ DE CATEGORÍAS
       ===================================================== */

    .menu-title {

      font-size: 22px;

      margin-bottom: 18px;

      color: #4a3529;
    }


    .menu-subtitle {

      font-family: Arial, sans-serif;

      font-size: 11px;

      color: #9a806d;

      letter-spacing: 0.5px;

      margin-bottom: 20px;
    }


    .categories {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }


    .category-button {

      background: rgba(255, 250, 244, 0.9);

      color: #4b362b;

      border: 1px solid #dfcbb5;

      border-radius: 20px;

      padding: 19px 10px;

      font-family: Arial, sans-serif;

      font-size: 12px;

      line-height: 1.35;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }


    .category-button:hover {

      background: #f1e2d1;

      transform: translateY(-2px);

      box-shadow:
        0 7px 18px rgba(72, 49, 32, 0.08);
    }


    .category-icon {

      display: block;

      font-family: Georgia, serif;

      font-size: 26px;

      margin-bottom: 8px;

      color: #9d7757;
    }


    .category-description {

      display: block;

      margin-top: 5px;

      font-size: 9px;

      color: #9b8471;
    }


    /* =====================================================
       JUEGO / PREGUNTA
       ===================================================== */

    #game {

      display: none;
    }


    .category {

      font-family: Arial, sans-serif;

      font-size: 11px;

      letter-spacing: 3px;

      text-transform: uppercase;

      color: #9a7659;

      margin-bottom: 16px;
    }


    .card {

      background:
        rgba(255, 252, 247, 0.95);

      border: 1px solid #e1d1be;

      border-radius: 25px;

      padding: 38px 28px;

      box-shadow:
        0 12px 35px rgba(72, 49, 32, 0.10);

      position: relative;

      overflow: hidden;
    }


    .card::before {

      content: "";

      position: absolute;

      width: 130px;

      height: 130px;

      border-radius: 50%;

      background: #efe0cf;

      opacity: 0.35;

      top: -65px;

      right: -65px;
    }


    .card::after {

      content: "";

      position: absolute;

      width: 100px;

      height: 100px;

      border-radius: 50%;

      background: #ead8c3;

      opacity: 0.25;

      bottom: -50px;

      left: -50px;
    }


    .question-number {

      font-family: Arial, sans-serif;

      font-size: 10px;

      letter-spacing: 2px;

      color: #ad8b69;

      margin-bottom: 22px;

      text-transform: uppercase;
    }


    .question {

      position: relative;

      z-index: 2;

      font-size:
        clamp(23px, 6vw, 31px);

      line-height: 1.4;

      color: #3d2c22;

      margin-bottom: 30px;
    }


    /* =====================================================
       BOTONES
       ===================================================== */

    .main-button {

      position: relative;

      z-index: 3;

      border: none;

      border-radius: 50px;

      background: #4b362b;

      color: #fffaf4;

      padding: 14px 25px;

      font-family: Arial, sans-serif;

      font-size: 11px;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        all 0.25s ease;
    }


    .main-button:hover {

      background: #705442;

      transform: translateY(-2px);
    }


    .secondary-button {

      background: transparent;

      color: #866b58;

      border: none;

      margin-top: 18px;

      font-family: Arial, sans-serif;

      font-size: 10px;

      letter-spacing: 1px;

      cursor: pointer;
    }


    .secondary-button:hover {

      color: #4b362b;
    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {

      margin-top: 18px;

      font-family: Arial, sans-serif;

      font-size: 10px;

      letter-spacing: 1px;

      color: #a08773;
    }


    .footer {

      margin-top: 25px;

      font-size: 12px;

      color: #a08773;

      font-style: italic;
    }


    /* =====================================================
       ANIMACIÓN
       ===================================================== */

    .fade {

      animation:
        fadeIn 0.45s ease;
    }


    @keyframes fadeIn {

      from {

        opacity: 0;

        transform:
          translateY(8px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    /* =====================================================
       MÓVIL
       ===================================================== */

    @media (max-width: 380px) {

      body {

        padding: 15px;
      }


      .categories {

        grid-template-columns: 1fr;
      }


      .card {

        padding: 30px 21px;
      }


      .question {

        font-size: 22px;
      }

    }

  </style>
</head>

/* ============================================================
   OBTENER PREGUNTAS UTILIZADAS
   ============================================================ */

function obtenerUsadas(categoria) {

  const guardadas =
    localStorage.getItem(
      "preguntas_" + categoria
    );


  if (!guardadas) {

    return [];

  }


  return JSON.parse(guardadas);

}



/* ============================================================
   GUARDAR PREGUNTAS UTILIZADAS
   ============================================================ */

  categoria,

  localStorage.setItem(

    "preguntas_" + categoria,

    JSON.stringify(usadas)

  );

}



/* ============================================================
   ABRIR CATEGORÍA
   ============================================================ */

function abrirCategoria(categoria) {


  categoriaActual =
    categoria;


  document.getElementById("menu")
    .style.display = "none";


  document.getElementById("game")
    .style.display = "block";


  document.getElementById("categoryName")
    .textContent =
      nombresCategorias[categoria];


  nuevaPregunta();

}



/* ============================================================
   VOLVER AL MENÚ
   ============================================================ */

function volverMenu() {


  document.getElementById("game")
    .style.display = "none";


  document.getElementById("menu")
    .style.display = "block";


}



/* ============================================================
   MOSTRAR NUEVA PREGUNTA
   ============================================================ */

function nuevaPregunta() {


  const lista =
    preguntas[categoriaActual];


  if (!lista || lista.length === 0) {


    document.getElementById("question")
      .textContent =
        "Todavía no hay preguntas en esta categoría ♡";


    return;

  }



  /* ---------------------------------------------
     Preguntas que ya aparecieron
     --------------------------------------------- */

  let usadas =
    obtenerUsadas(categoriaActual);



  /* ---------------------------------------------
     Si ya aparecieron todas,
     empezamos nuevamente
     --------------------------------------------- */

  if (usadas.length >= lista.length) {

    usadas = [];

  }



  /* ---------------------------------------------
     Buscar una pregunta nueva
     --------------------------------------------- */

  let indice;


  do {

    indice =
      Math.floor(
        Math.random() *
        lista.length
      );

  }

  while (
    usadas.includes(indice)
  );



  /* ---------------------------------------------
     Guardar como utilizada
     --------------------------------------------- */

  usadas.push(indice);


  guardarUsadas(
    categoriaActual,
    usadas
  );



  /* ---------------------------------------------
     Mostrar pregunta
     --------------------------------------------- */

  const elemento =
    document.getElementById(
      "question"
    );


  elemento.classList.remove(
    "fade"
  );


  void elemento.offsetWidth;


  elemento.classList.add(
    "fade"
  );


  elemento.textContent =
    lista[indice];



  /* ---------------------------------------------
     Número de pregunta
     --------------------------------------------- */

  document.getElementById(
    "questionNumber"
  ).textContent =

    "Pregunta " +
    usadas.length;



  /* ---------------------------------------------
     Contador
     --------------------------------------------- */

  document.getElementById(
    "counter"
  ).textContent =

    usadas.length +
    " de " +
    lista.length +
    " preguntas";

}



/* ============================================================
   INICIAR PÁGINA
   ============================================================

   Como ahora solamente utilizaremos UN QR,
   la página siempre comienza mostrando
   el menú de categorías.

   ============================================================ */

document.getElementById("menu")
  .style.display = "block";


document.getElementById("game")
  .style.display = "none";


</script>
